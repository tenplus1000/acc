function renderParkedList(s, ui) {
  const parked = s.parked || [];
  const wrap = document.createElement("div");
  wrap.innerHTML = `<div class="field-label">擱置（${parked.length}）</div>`;
  const list = document.createElement("div");
  list.className = "parked-list";
  parked.forEach((b, idx) => {
    const row = document.createElement("div");
    row.className = "parked-row";
    row.draggable = true;
    row.dataset.oid = b.oid;
    row.innerHTML = `
      <span class="parked-handle" title="拖曳排序">⠿</span>
      <span class="parked-order">${idx + 1}</span>
      <div class="parked-body">
        <div class="parked-obj">${escapeHtml(b.objective || "（尚未設定）")}</div>
        <div class="parked-criteria">${escapeHtml(b.success_criteria || "")}</div>
        <div class="parked-meta">擱置於：${escapeHtml(relativeTime(b.parked_at))}</div>
      </div>
      <div class="parked-actions">
        <div class="row">
          <button class="ghost btn-parked-up" title="上移"${idx === 0 ? " disabled" : ""}>↑</button>
          <button class="ghost btn-parked-down" title="下移"${idx === parked.length - 1 ? " disabled" : ""}>↓</button>
        </div>
        <button class="primary btn-parked-switch">切上來</button>
        <button class="btn-parked-delete">移除</button>
      </div>
    `;
    row.querySelector(".btn-parked-switch").onclick = () =>
      post("/api/goals/session/parked/switch", { sessionId: s.session_id, oid: b.oid });
    row.querySelector(".parked-actions").appendChild(
      renderAmendControl(s, ui, "amend:p" + (b.oid || idx), b.oid || `P${idx + 1}`, [
        { label: "成功", val: "achieved" },
        { label: "失敗", val: "failed" },
      ])
    );

    const moveTo = (from, to) => {
      if (to < 0 || to >= parked.length) return;
      const oids = parked.map(x => x.oid);
      const [m] = oids.splice(from, 1);
      oids.splice(to, 0, m);
      post("/api/goals/session/parked/reorder", { sessionId: s.session_id, oids });
    };
    row.querySelector(".btn-parked-up").onclick = () => moveTo(idx, idx - 1);
    row.querySelector(".btn-parked-down").onclick = () => moveTo(idx, idx + 1);

    const delBtn = row.querySelector(".btn-parked-delete");
    delBtn.onclick = () => {
      ui.parkedDeleteConfirm = ui.parkedDeleteConfirm === b.oid ? null : b.oid;
      renderSessions();
    };
    if (ui.parkedDeleteConfirm === b.oid) {
      const confirmDiv = document.createElement("div");
      confirmDiv.className = "inline-confirm";
      confirmDiv.innerHTML = `
        <div>確定移除這個擱置的 Objective？</div>
        <div class="row" style="margin-top:6px;">
          <button class="danger btn-parked-delete-confirm">確認移除</button>
          <button class="btn-parked-delete-cancel">取消</button>
        </div>
      `;
      confirmDiv.querySelector(".btn-parked-delete-confirm").onclick = () => {
        ui.parkedDeleteConfirm = null;
        post("/api/goals/session/parked/delete", { sessionId: s.session_id, oid: b.oid });
      };
      confirmDiv.querySelector(".btn-parked-delete-cancel").onclick = () => {
        ui.parkedDeleteConfirm = null;
        renderSessions();
      };
      row.querySelector(".parked-body").appendChild(confirmDiv);
    }

    // native HTML5 drag-and-drop reorder (↑/↓ buttons above are the
    // touch/keyboard fallback).
    row.addEventListener("dragstart", (e) => {
      ui.dragOid = b.oid;
      e.dataTransfer.effectAllowed = "move";
      try { e.dataTransfer.setData("text/plain", b.oid); } catch (err) { /* ignore */ }
    });
    row.addEventListener("dragover", (e) => {
      e.preventDefault();
      row.classList.add("drag-over");
    });
    row.addEventListener("dragleave", () => row.classList.remove("drag-over"));
    row.addEventListener("drop", (e) => {
      e.preventDefault();
      row.classList.remove("drag-over");
      const fromOid = ui.dragOid;
      ui.dragOid = null;
      if (!fromOid || fromOid === b.oid) return;
      const oids = parked.map(x => x.oid);
      const fromIdx = oids.indexOf(fromOid);
      const toIdx = oids.indexOf(b.oid);
      if (fromIdx === -1 || toIdx === -1) return;
      oids.splice(toIdx, 0, oids.splice(fromIdx, 1)[0]);
      post("/api/goals/session/parked/reorder", { sessionId: s.session_id, oids });
    });

    list.appendChild(row);
  });
  wrap.appendChild(list);
  return wrap;
}

function renderSessionCard(s) {
  const ui = getUi(s.session_id);
  const div = document.createElement("div");
  div.className = "session-card";
  div.dataset.sessionId = s.session_id;

  const stripe = document.createElement("div");
  stripe.className = "stripe";
  stripe.style.background = stripeColor(s.session_id);
  div.appendChild(stripe);

  const body = document.createElement("div");
  body.className = "session-body";

  // -- header --
  const header = document.createElement("div");
  header.className = "card-header";
  const revived = s.revived_at && (Date.now() - new Date(s.revived_at).getTime()) < 6 * 3600 * 1000;
  const rapportChip = (s.rapport_enabled_effective === false)
    ? `Rapport 關 · ${s.rapport_enabled_source === "session" ? "個別設定" : "跟隨全域"}`
    : `L${(s.rapport_effective || {}).level || ""} ${escapeHtml((s.rapport_effective || {}).name || "")} · ${s.rapport ? "個別設定" : "跟隨預設"}`;

  const titleRow = document.createElement("div");
  titleRow.className = "card-title-row";
  if (ui.editingNickname) {
    titleRow.innerHTML = `
      <input type="text" class="s-nickname-input" style="min-width:160px;" placeholder="輸入暱稱，留空清除">
      <button class="ghost btn-nickname-save">✓</button>
      <button class="ghost btn-nickname-cancel">✕</button>
    `;
  } else {
    titleRow.innerHTML = `
      <span class="card-title">${escapeHtml(sessionTitle(s))}</span>
      <button class="pencil" title="編輯暱稱">✎</button>
      <span class="badge">${escapeHtml(agentLabel(s.agent))}</span>
      <span class="short-id mono" title="${escapeAttr(s.session_id)}">${escapeHtml((s.session_id || "").slice(0, 8))}</span>
      ${s.project ? `<span class="project-chip" title="${escapeAttr(s.project)}">${escapeHtml(basename(s.project))}</span>` : ""}
      ${(s.parked && s.parked.length) ? `<span class="badge">擱置 ${s.parked.length}</span>` : ""}
      ${revived ? `<span class="badge accent">剛從封存回來</span>` : ""}
    `;
  }
  header.appendChild(titleRow);

  const rightMeta = document.createElement("div");
  rightMeta.style.textAlign = "right";
  rightMeta.innerHTML = `<span class="muted s-relative-time" data-last-seen="${escapeAttr(s.last_seen || "")}">${escapeHtml(relativeTime(s.last_seen))}</span>`;
  header.appendChild(rightMeta);

  header.style.cursor = "pointer";
  header.onclick = (e) => {
    if (e.target.closest(".pencil, .s-nickname-input, .btn-nickname-save, .btn-nickname-cancel, .short-id")) return;
    ui.expanded = !ui.expanded;
    renderSessions();
  };
  body.appendChild(header);

  if (ui.editingNickname) {
    const input = titleRow.querySelector(".s-nickname-input");
    input.value = ui.nicknameDraft !== null ? ui.nicknameDraft : (s.nickname || "");
    input.oninput = () => { ui.nicknameDraft = input.value; };
    input.onclick = (e) => e.stopPropagation();
    titleRow.querySelector(".btn-nickname-save").onclick = async (e) => {
      e.stopPropagation();
      const val = input.value;
      const btn = titleRow.querySelector(".btn-nickname-save");
      btn.disabled = true;
      btn.textContent = "…";
      ui.editingNickname = false;
      ui.nicknameDraft = null;
      await post("/api/goals/session/nickname", { sessionId: s.session_id, nickname: val });
    };
    titleRow.querySelector(".btn-nickname-cancel").onclick = (e) => {
      e.stopPropagation();
      ui.editingNickname = false;
      ui.nicknameDraft = null;
      renderSessions();
    };
  } else {
    titleRow.querySelector(".pencil").onclick = (e) => {
      e.stopPropagation();
      ui.editingNickname = true;
      ui.nicknameDraft = s.nickname || "";
      renderSessions();
    };
    const sid = titleRow.querySelector(".short-id");
    if (sid) sid.onclick = (e) => { e.stopPropagation(); copyToClipboard(s.session_id); };
    const chip = titleRow.querySelector(".project-chip");
    if (chip) chip.onclick = (e) => { e.stopPropagation(); scrollToProject(s.project); };
  }

  // -- collapsed one-liner --
  const oneliner = document.createElement("div");
  oneliner.className = "card-oneliner";
  const objText = s.status === "active" ? (s.objective || "（尚未設定）") : "沒有進行中的 Objective";
  oneliner.innerHTML = `${escapeHtml(objText)} <span class="badge" style="margin-left:6px;">${escapeHtml(rapportChip)}</span>`;
  body.appendChild(oneliner);

  // -- expanded body --
  if (ui.expanded) {
    const expand = document.createElement("div");
    expand.className = "card-expand-body";

    // 1. top row: per-session Rapport controls (left) + project chip (right)
    const topRow = document.createElement("div");
    topRow.className = "card-top-row section-block";
    const rapportWrap = document.createElement("div");
    rapportWrap.className = "s-rapport-wrap";
    rapportWrap.appendChild(renderSessionRapport(s));
    topRow.appendChild(rapportWrap);
    if (s.project) topRow.appendChild(renderProjectChip(s, ui));
    topRow.appendChild(renderWorkLogControls(s, ui));
    expand.appendChild(topRow);
    if (ui.workLogOpen) expand.appendChild(renderWorkLogView(s, ui));

    // 2. 進行中 / 尚未設定 block
    const activeWrap = document.createElement("div");
    activeWrap.className = "section-block";
    activeWrap.appendChild(renderActiveBlock(s, ui));
    expand.appendChild(activeWrap);

    // 3. 擱置（N） list -- hidden when empty
    if ((s.parked || []).length) {
      const parkedWrap = document.createElement("div");
      parkedWrap.className = "section-block";
      parkedWrap.appendChild(renderParkedList(s, ui));
      expand.appendChild(parkedWrap);
    }

    // 4. 已結案 timeline
    const tlBlock = document.createElement("div");
    tlBlock.className = "section-block";
    tlBlock.innerHTML = `<div class="field-label">已結案</div>`;
    const tlWrap = document.createElement("div");
    tlWrap.className = "timeline";
    const entries = buildTimelineEntries(s);
    if (!entries.length) {
      tlWrap.innerHTML = `<div class="muted">目前沒有任何已結案的 Objective。</div>`;
    } else {
      entries.forEach(entry => tlWrap.appendChild(renderTimelineItem(s, entry, ui)));
    }
    tlBlock.appendChild(tlWrap);
    expand.appendChild(tlBlock);

    // 5. 封存 (bottom), plus a context preview kept alongside it
    const bottomBlock = document.createElement("div");
    bottomBlock.className = "section-block";
    const bottomRow = document.createElement("div");
    bottomRow.className = "row";
    const previewBtn = document.createElement("button");
    previewBtn.textContent = "預覽 context";
    const previewPre = document.createElement("pre");
    previewPre.className = "preview";
    previewPre.style.display = "none";
    previewBtn.onclick = async () => {
      try {
        const res = await api("GET", `/api/context?session=${encodeURIComponent(s.session_id)}&cwd=${encodeURIComponent(s.cwd || ".")}`);
        previewPre.textContent = res.context || "（空）";
        previewPre.style.display = "block";
      } catch (e) {
        showToast("預覽失敗：" + e.message);
      }
    };
    bottomRow.appendChild(previewBtn);
    const archiveBtn = document.createElement("button");
    archiveBtn.textContent = "封存";
    archiveBtn.onclick = () => post("/api/goals/session/archive", { sessionId: s.session_id });
    bottomRow.appendChild(archiveBtn);
    bottomBlock.appendChild(bottomRow);
    bottomBlock.appendChild(previewPre);
    expand.appendChild(bottomBlock);

    body.appendChild(expand);
  }

  div.appendChild(body);
  return div;
}

function updateRelativeTimes() {
  $$(".s-relative-time").forEach(el => {
    el.textContent = relativeTime(el.dataset.lastSeen);
  });
}
setInterval(updateRelativeTimes, 30000);

// ============================================================================
// Wiring: top-level buttons
// ============================================================================

$("#btn-create-preset").onclick = () => {
  const name = $("#new-preset-name").value.trim();
  if (!name) return;
  $("#new-preset-name").value = "";
  (async () => {
    try {
      const before = new Set(state.rapport.presets.map(p => p.id));
      state = await api("POST", "/api/rapport/preset/create", { name });
      const created = state.rapport.presets.find(p => !before.has(p.id));
      modalState.presetId = created ? created.id : state.rapport.activePreset;
      render();
    } catch (e) {
      showToast(e.message);
    }
  })();
};
$("#btn-rename-preset").onclick = () => {
  const preset = state.rapport.presets.find(p => p.id === modalState.presetId) || activePreset();
  const name = $("#rename-preset-name").value.trim();
  if (!preset || !name) return;
  (async () => {
    try {
      state = await api("POST", "/api/rapport/preset/rename", { presetId: preset.id, name });
      render();
    } catch (e) {
      showToast(e.message);
    }
  })();
};
$("#btn-delete-preset").onclick = () => {
  const preset = state.rapport.presets.find(p => p.id === modalState.presetId) || activePreset();
  if (!preset) return;
  modalState.deleteConfirm = true;
  render();
};
$("#btn-add-level").onclick = () => {
  const preset = state.rapport.presets.find(p => p.id === modalState.presetId) || activePreset();
  if (!preset) return;
  post("/api/rapport/level/add", { presetId: preset.id });
};
$("#btn-remove-level").onclick = () => {
  const preset = state.rapport.presets.find(p => p.id === modalState.presetId) || activePreset();
  if (!preset) return;
  post("/api/rapport/level/remove", { presetId: preset.id });
};
$("#btn-save-ultimate").onclick = () => {
  const goal = $("#ultimate-goal").value;
  const definition = $("#ultimate-definition").value;
  saveWithFeedback("ultimate", $("#btn-save-ultimate"), "/api/goals/ultimate", { goal, definition }, () => {
    clearDraft("ultimate.goal");
    clearDraft("ultimate.definition");
  });
};
$("#btn-add-project").onclick = () => {
  const path = $("#new-project-path").value.trim();
  if (!path) return;
  const btn = $("#btn-add-project");
  saveWithFeedback("add-project", btn, "/api/goals/project", { path, super_objective: "" }, () => {
    $("#new-project-path").value = "";
  });
};

refresh();
setInterval(() => {
  const el = document.activeElement;
  if (el && (el.tagName === "TEXTAREA" || el.tagName === "INPUT")) return;
  refresh();
}, 30000);
</script>
